<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход - Online Theater</title>
</head>
<body>
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h2 class="text-center mb-4">Вход в аккаунт</h2>
                            
                            <!-- Сообщения об ошибках -->
                            <div th:if="${error}" class="alert alert-danger" role="alert">
                                <p th:text="${error}">Ошибка</p>
                            </div>

                            <!-- Форма входа -->
                            <form th:action="@{/login}" method="post">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Имя пользователя</label>
                                    <input type="text" class="form-control" id="username" name="username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Пароль</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                                    <label class="form-check-label" for="remember-me">Запомнить меня</label>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Войти</button>
                                </div>
                            </form>

                            <!-- Дополнительные ссылки -->
                            <div class="text-center mt-4">
                                <p>Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
                                <p><a th:href="@{/forgot-password}">Забыли пароль?</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
