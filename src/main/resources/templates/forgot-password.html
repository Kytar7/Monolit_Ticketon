<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Восстановление пароля - Online Theater</title>
</head>
<body>
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h2 class="text-center mb-4">Восстановление пароля</h2>
                            
                            <!-- Сообщения об ошибках -->
                            <div th:if="${error}" class="alert alert-danger" role="alert">
                                <p th:text="${error}">Ошибка</p>
                            </div>

                            <!-- Сообщения об успехе -->
                            <div th:if="${message}" class="alert alert-success" role="alert">
                                <p th:text="${message}">Сообщение</p>
                            </div>

                            <!-- Форма восстановления пароля -->
                            <form th:action="@{/forgot-password}" method="post">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Отправить инструкции</button>
                                </div>
                            </form>

                            <!-- Дополнительные ссылки -->
                            <div class="text-center mt-4">
                                <p><a th:href="@{/login}">Вернуться к входу</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
